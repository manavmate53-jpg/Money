name: "3. Investment Council & Vault (Daily)"

on:
  schedule:
    # Runs once daily at 23:30 UTC
    - cron: "30 23 * * *"
  repository_dispatch:
    types: [run-council-desk]
  workflow_dispatch:

concurrency:
  group: deriv-bot-state-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  council_committee:
    name: "Post-Mortem Reflexion, Vault Sweep & Calibration"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute Daily Council Post-Mortems & Vault Sweep"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DERIV_APP_ID: "1089"
        run: |
          python main.py --cycle council

      - name: "Commit & Push Strategy Weights & Scoreboard"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config/strategy_weights.json config/active_filters.json data/ reports/
          if git diff --staged --quiet; then
            echo "No council changes to commit."
          else
            git commit -m "chore(bot): daily investment council & vault update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 5;
            done
          fi
