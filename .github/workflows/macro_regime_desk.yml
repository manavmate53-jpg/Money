name: "2. Macro & Regime Desk (4-Hour)"

on:
  schedule:
    # Runs every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: deriv-bot-state-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macro_desk:
    name: "Multi-Timeframe Macro Vision & Regime Scoring"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Install Playwright Chromium"
        run: |
          playwright install --with-deps chromium

      - name: "Execute 4-Hour Macro Regime Cycle"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DERIV_APP_ID: "1089"
        run: |
          python main.py --cycle macro

      - name: "Commit & Push Updated Macro Bias"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config/macro_bias.json data/
          if git diff --staged --quiet; then
            echo "No macro changes to commit."
          else
            git commit -m "chore(bot): 4-hour macro regime update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 5;
            done
          fi
